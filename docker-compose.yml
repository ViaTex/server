services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dishasetu
      POSTGRES_PASSWORD: dishasetu
      POSTGRES_DB: dishasetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dishasetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_P4jlzanHpZ1S@ep-dawn-paper-ajvvros5-pooler.c-3.us-east-2.aws.neon.tech/neondb?sslmode=require
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      APP_URL: http://localhost:8000
      DEBUG: "true"
      SECRET_KEY: change-me-in-production
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

volumes:
  pgdata:
